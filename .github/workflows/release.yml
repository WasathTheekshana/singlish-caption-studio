name: Release

# Releases follow the commit messages, see docs/releasing.md.
#
# On every push to main, release-please keeps a release pull request up to date. Merging that
# pull request creates the tag and the GitHub release, and the build job then builds a signed
# installer and attaches it, together with the update manifest that installed apps read.
#
# "Run workflow" (manual) builds the installer and keeps it as a build artifact. If you also give it
# the tag of an existing release, it builds that tag and attaches the files to that release.
# That is how to repair a release whose build failed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to attach the files to, like singlish-caption-studio-v0.2.0. Leave empty to only build an artifact."
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Prepare the release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the tag and the release
      pull-requests: write  # open and update the release pull request
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build the Windows installer
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write      # attach the files to the release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.sha }}
          persist-credentials: false

      - name: Check that the version files agree with the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tauri = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($cargo -ne $tauri) {
            Write-Error "Cargo.toml says $cargo but tauri.conf.json says $tauri"
            exit 1
          }
          if ($env:TAG) {
            # A tag is "v0.1.0", or "singlish-caption-studio-v0.1.0" when the package name is part of it.
            if ($env:TAG -notmatch '^(?:[A-Za-z0-9._-]+-)?v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
              Write-Error "Unexpected tag name $env:TAG"
              exit 1
            }
            if ($Matches['version'] -ne $cargo) {
              Write-Error "Tag $env:TAG does not match the version $cargo in the project files"
              exit 1
            }
          }
          Write-Host "Building version $cargo"
          "version=$cargo" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Fail early with a clear message, before the long build, if the signing key is missing.
      - name: Check that the signing key is configured
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) {
            Write-Error "The TAURI_SIGNING_PRIVATE_KEY secret is not set, so the installer cannot be signed. See docs/releasing.md."
            exit 1
          }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Release builds use no caches. A cache entry could hold a tampered build tool, and this job
      # publishes what it builds, so it starts clean every time. The tool version is pinned for the
      # same reason, and is raised on purpose (see docs/releasing.md), never by accident.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "=2.12.4" --locked

      - name: Test
        run: cargo test

      # Building compiles hundreds of dependencies, and their build scripts run code. So this step has
      # no access to the signing key at all, and signing happens in the next step.
      - name: Build the installer
        run: cargo tauri build --bundles nsis --config tauri.unsigned.conf.json

      # The only step that sees the signing key, and it runs no project or dependency code, only the
      # pinned Tauri CLI signing one file. --app-version ties the signature to this exact version.
      - name: Sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A secret pasted into GitHub often gains a trailing line break, and the signer rejects that.
          foreach ($name in "TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD") {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { [Environment]::SetEnvironmentVariable($name, $value.TrimEnd("`r", "`n")) }
          }
          $installer = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "The build did not produce an installer."
            exit 1
          }
          cargo tauri signer sign --app-version $env:VERSION $installer.FullName
          if (-not (Test-Path "$($installer.FullName).sig")) {
            Write-Error "The installer was not signed."
            exit 1
          }

      # GitHub renames files with spaces, so the installer gets a plain name to keep its address predictable.
      - name: Prepare the release files
        id: files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $src = "target/release/bundle/nsis"
          $out = "release-files"
          New-Item -ItemType Directory -Path $out | Out-Null
          $installer = Get-ChildItem $src -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer -or -not (Test-Path "$($installer.FullName).sig")) {
            Write-Error "The build did not produce a signed installer."
            exit 1
          }
          $name = "Singlish-Caption-Studio_$($env:VERSION)_x64-setup.exe"
          Copy-Item $installer.FullName "$out/$name"
          Copy-Item "$($installer.FullName).sig" "$out/$name.sig"
          $hash = (Get-FileHash "$out/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "$out/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$out/SHA256SUMS.txt"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*-setup.exe

      - name: Keep the files as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: release-files/*
          if-no-files-found: error

      - name: Write the update manifest
        if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.files.outputs.name }}
        run: |
          gh release view $env:TAG --json body --jq .body | Out-File -FilePath notes.md -Encoding utf8
          python tools/make_latest_json.py --version $env:VERSION --repo $env:GH_REPO --tag $env:TAG --asset $env:ASSET --sig-file "release-files/$($env:ASSET).sig" --notes-file notes.md --out release-files/latest.json
          Get-Content release-files/latest.json

      # The manifest goes last, so an app never reads it before the installer it points to exists.
      - name: Attach the files to the release
        if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          $files = Get-ChildItem release-files -File | Where-Object { $_.Name -ne "latest.json" } | ForEach-Object { $_.FullName }
          gh release upload $env:TAG @files --clobber
          gh release upload $env:TAG release-files/latest.json --clobber

      # GitHub can change a file name on upload. Make sure the addresses the app will use really work.
      - name: Check that the published files can be downloaded
        if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          ASSET: ${{ steps.files.outputs.name }}
        run: |
          $base = "https://github.com/$($env:GH_REPO)/releases/download/$($env:TAG)"
          foreach ($file in @($env:ASSET, "$($env:ASSET).sig", "SHA256SUMS.txt", "latest.json")) {
            $response = Invoke-WebRequest -Method Head -Uri "$base/$file" -MaximumRedirection 5
            Write-Host "$file : HTTP $($response.StatusCode)"
          }
