name: Release

# Releases follow the commit messages, see docs/releasing.md.
#
# On every push to main, release-please keeps a release pull request up to date. Merging that
# pull request creates the tag and the GitHub release, and the build job then attaches the
# installer.
#
# "Run workflow" (manual) builds the installer and keeps it as a build artifact. If you also give it
# the tag of an existing release, it builds that tag and attaches the installer to that release.
# That is how to repair a release whose build failed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to attach the installer to, like singlish-caption-studio-v0.1.0. Leave empty to only build an artifact."
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Prepare the release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the tag and the release
      pull-requests: write  # open and update the release pull request
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build the Windows installer
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write      # attach the files to the release
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.sha }}
          persist-credentials: false

      - name: Check that the version files agree with the tag
        shell: pwsh
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tauri = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($cargo -ne $tauri) {
            Write-Error "Cargo.toml says $cargo but tauri.conf.json says $tauri"
            exit 1
          }
          if ($env:TAG) {
            # A tag is "v0.1.0", or "singlish-caption-studio-v0.1.0" when the package name is part of it.
            if ($env:TAG -notmatch '^(?:[A-Za-z0-9._-]+-)?v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
              Write-Error "Unexpected tag name $env:TAG"
              exit 1
            }
            if ($Matches['version'] -ne $cargo) {
              Write-Error "Tag $env:TAG does not match the version $cargo in the project files"
              exit 1
            }
          }
          Write-Host "Building version $cargo"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Release builds use no caches. A cache entry could hold a tampered build tool, and this job
      # publishes what it builds, so it starts clean every time.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Test
        run: cargo test

      - name: Build the installer
        run: cargo tauri build --bundles nsis

      - name: Write checksums
        shell: pwsh
        run: |
          $dir = "target/release/bundle/nsis"
          Get-ChildItem $dir -Filter "*-setup.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$dir/SHA256SUMS.txt" -Append -Encoding ascii
          }
          Get-Content "$dir/SHA256SUMS.txt"

      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/bundle/nsis/*-setup.exe

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach the installer to the release
        if: needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          $dir = "target/release/bundle/nsis"
          $files = @(Get-ChildItem $dir -Filter "*-setup.exe") + @(Get-Item "$dir/SHA256SUMS.txt") | ForEach-Object { $_.FullName }
          gh release upload $env:TAG @files --clobber
